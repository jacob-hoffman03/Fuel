<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Fuel v2 · 2026.10.04-h · light mode · Today's Intake calorie panel (rings fit fix) · sticky frosted header · left pill shell · app-shell scroll -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf0f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fuel</title>
<style>
  :root{
    --bg:#edf0f5;
    --sheet:#ffffff;
    --card:#edf0f5;
    --text:#191d23;
    --text-dim:#5b6470;
    --accent:#2f7cf6;
    --pill:#ffffff;
    --teal:#0d7f9e;
    --teal-deep:#0a5f77;
    --ink:#12333c;
    --ink-dim:#4a6b75;
    --ink-faint:#6b8b95;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }
  .app{
    height:100dvh;
    max-width:480px;
    margin:0 auto;
    position:relative;
  }
  .scroller{
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    background:var(--bg);
  }
  header.fuel-header{
    position:sticky;
    top:0;
    z-index:50;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:calc(env(safe-area-inset-top, 0px) + 36px) 20px 18px;
    transition:background .25s ease;
  }
  header.fuel-header.scrolled{
    background:rgba(237,240,245,.72);
    -webkit-backdrop-filter:blur(18px) saturate(1.5);
    backdrop-filter:blur(18px) saturate(1.5);
  }
  .fuel-header .slot-left{display:flex;justify-content:flex-start;min-width:44px}
  .stat-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:#ffffff;
    border:1px solid rgba(20,30,45,.08);
    box-shadow:0 1px 4px rgba(20,30,45,.08);
    border-radius:999px;
    padding:10px 16px;
    font-size:17px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
  }
  .stat-pill svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .stat-pill .badge{fill:#fff}
  .stat-pill .ph{color:var(--text-dim)}
  .fuel-header .slot-date{
    text-align:center;
    font-size:17px;
    font-weight:600;
    letter-spacing:.2px;
    white-space:nowrap;
    color:var(--text);
  }
  .fuel-header .slot-right{
    display:flex;
    justify-content:flex-end;
    min-width:44px;
  }
  .avatar{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#dde3ea;
    border:2.5px solid var(--accent);
    box-shadow:0 0 0 3px rgba(47,124,246,.18);
  }
  .avatar svg{width:24px;height:24px;stroke:#5b6470;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  main.sheet{
    background:var(--sheet);
    border-radius:30px 30px 0 0;
    padding:30px 24px calc(env(safe-area-inset-bottom, 0px) + 32px);
    min-height:60dvh;
  }
  /* ---------- Today's Intake calorie panel ---------- */
  .intake-card{
    position:relative;
    overflow:hidden;
    border-radius:28px;
    padding:24px 16px 26px;
    background:linear-gradient(165deg,#ddf0f4 0%,#c6e4ea 100%);
    color:var(--ink);
    margin-bottom:30px;
    box-shadow:0 8px 22px rgba(13,127,158,.14);
  }
  .intake-blob{
    position:absolute;top:-78px;right:-78px;width:230px;height:230px;border-radius:50%;
    background:rgba(255,255,255,.30);
    pointer-events:none;
  }
  .intake-head{
    position:relative;
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:12px;
  }
  .intake-head h3{font-size:21px;font-weight:700;letter-spacing:-.2px}
  .intake-head .intake-date{font-size:15px;font-weight:600;color:var(--ink-dim)}
  .week-strip{position:relative;display:flex;align-items:center;margin-bottom:10px}
  .wk-arrow{
    background:none;border:0;color:var(--ink-faint);
    font-size:22px;font-weight:700;padding:10px 6px;cursor:pointer;line-height:1;
  }
  .wk-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
  .wk-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
  .wk-day .dow{font-size:12.5px;font-weight:600;color:var(--ink-faint)}
  .wk-day .dnum{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:700;color:var(--ink-dim);
  }
  .wk-day.today .dow{color:var(--ink)}
  .wk-day.today .dnum{background:#fff;color:var(--teal);box-shadow:0 3px 10px rgba(13,127,158,.28)}
  .wk-day .dot{width:5px;height:5px;border-radius:50%;margin-top:1px}
  .rings-row{
    position:relative;
    display:flex;align-items:center;justify-content:space-between;
    margin:4px 0 20px;
  }
  .mini-col{display:flex;flex-direction:column;gap:16px}
  .mini-ring{position:relative;width:68px;height:68px}
  .mini-ring svg{width:68px;height:68px;transform:rotate(-90deg);display:block}
  .mini-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .mini-center .mv{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .mini-center .ml{font-size:8.5px;font-weight:700;letter-spacing:1px;color:var(--ink-dim)}
  .big-ring{position:relative;width:170px;height:170px;flex:none}
  .big-ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .big-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  }
  .big-center .bl{font-size:13px;font-weight:600;color:var(--ink-dim);letter-spacing:.5px;margin-bottom:2px}
  .big-center .bv{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.05}
  .big-center .bs{font-size:14px;font-weight:700;color:#2c4f59;margin-top:4px;white-space:nowrap}
  .goal-line{position:relative;font-size:19px;font-weight:700;margin-bottom:12px}
  .goal-row{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .goal-bar{position:relative;flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.60)}
  .goal-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ff5a3c,#ff9a3c)}
  .goal-tick{
    position:absolute;top:-3px;bottom:-3px;left:100%;width:3px;border-radius:2px;
    background:var(--ink);transform:translateX(-50%);
  }
  .goal-info{
    flex:none;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--ink-dim);
  }
  .nutrition-link{
    position:relative;text-align:center;
    font-size:21px;font-weight:800;letter-spacing:-.3px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="scroller" id="scroller">
      <header class="fuel-header">
        <div class="slot-left">
          <span class="stat-pill" aria-label="Status">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="2.5" width="10.5" height="19" rx="2.5"/>
              <rect class="badge" x="13.5" y="15.5" width="7" height="4.4" rx="1.2"/>
              <path d="M21.2 16.9v1.6"/>
            </svg>
            <span class="ph">—</span>
          </span>
        </div>
        <div class="slot-date" id="hdrDate"></div>
        <div class="slot-right">
          <div class="avatar" aria-label="Profile">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.6"/>
              <path d="M5 19.5c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/>
            </svg>
          </div>
        </div>
      </header>

      <main class="sheet">
        <section class="intake-card" aria-label="Today's intake">
          <div class="intake-blob"></div>
          <div class="intake-head">
            <h3>Today's Intake</h3>
            <span class="intake-date" id="intakeDate"></span>
          </div>
          <div class="week-strip">
            <button class="wk-arrow" id="wkPrev" aria-label="Previous week">‹</button>
            <div class="wk-days" id="wkDays"></div>
            <button class="wk-arrow" id="wkNext" aria-label="Next week">›</button>
          </div>
          <div class="rings-row">
            <div class="mini-col">
              <div class="mini-ring">
                <svg viewBox="0 0 84 84">
                  <circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.60)" stroke-width="9"/>
                  <circle cx="42" cy="42" r="34" fill="none" stroke="#0d7f9e" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
                </svg>
                <div class="mini-center"><span class="mv">–</span><span class="ml">FATIGUE</span></div>
              </div>
              <div class="mini-ring">
                <svg viewBox="0 0 84 84">
                  <circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.60)" stroke-width="9"/>
                  <circle cx="42" cy="42" r="34" fill="none" stroke="#0d7f9e" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
                </svg>
                <div class="mini-center"><span class="mv">–</span><span class="ml">BLOAT</span></div>
              </div>
            </div>
            <div class="big-ring">
              <svg viewBox="0 0 220 220">
                <circle cx="110" cy="110" r="98" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
                <circle cx="110" cy="110" r="86" fill="none" stroke="rgba(255,255,255,.60)" stroke-width="15"/>
                <circle id="bigProg" cx="110" cy="110" r="86" fill="none" stroke="#0d7f9e" stroke-width="15" stroke-linecap="round" stroke-dasharray="540.4" stroke-dashoffset="540.4"/>
              </svg>
              <div class="big-center">
                <span class="bl">Eaten</span>
                <span class="bv" id="eatenVal">0</span>
                <span class="bs" id="remainVal">3,405 kcal to go</span>
              </div>
            </div>
            <div class="mini-ring">
              <svg viewBox="0 0 84 84">
                <circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.60)" stroke-width="9"/>
                <circle cx="42" cy="42" r="34" fill="none" stroke="#0d7f9e" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
              </svg>
              <div class="mini-center"><span class="mv">0%</span><span class="ml">ADHERENCE</span></div>
            </div>
          </div>
          <div class="goal-line" id="goalLine">0% of daily goal</div>
          <div class="goal-row">
            <div class="goal-bar">
              <div class="goal-fill" id="goalFill"></div>
              <div class="goal-tick"></div>
            </div>
            <div class="goal-info">i</div>
          </div>
          <div class="nutrition-link">Nutrition Analysis ›</div>
        </section>

      </main>
    </div>
  </div>

<script>
  (function(){
    "use strict";
    var GOAL = 3405; // daily calorie goal (bulk target)
    var now = new Date();

    // Header date
    document.getElementById('hdrDate').textContent =
      now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

    // Panel date
    document.getElementById('intakeDate').textContent =
      now.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});

    // No-data state
    var eaten = 0;
    document.getElementById('eatenVal').textContent = eaten.toLocaleString('en-US');
    document.getElementById('remainVal').textContent =
      (GOAL - eaten).toLocaleString('en-US') + ' kcal to go';
    document.getElementById('goalLine').textContent = '0% of daily goal';
    document.getElementById('goalFill').style.width = '0%';

    // Week strip (Sunday start), arrows shift weeks
    var DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var weekOffset = 0;
    function renderWeek(){
      var base = new Date(now);
      base.setDate(now.getDate() - now.getDay() + weekOffset * 7);
      var html = '';
      for (var i = 0; i < 7; i++){
        var dt = new Date(base);
        dt.setDate(base.getDate() + i);
        var isT = dt.toDateString() === now.toDateString();
        html += '<div class="wk-day' + (isT ? ' today' : '') + '">' +
          '<span class="dow">' + DOWS[i] + '</span>' +
          '<span class="dnum">' + dt.getDate() + '</span>' +
          '<span class="dot"></span></div>';
      }
      document.getElementById('wkDays').innerHTML = html;
    }
    document.getElementById('wkPrev').addEventListener('click', function(){ weekOffset--; renderWeek(); });
    document.getElementById('wkNext').addEventListener('click', function(){ weekOffset++; renderWeek(); });
    renderWeek();

    // Sticky header goes frosted once the inner scroller moves. The fixed body
    // means the browser never overscrolls, so no pull-to-refresh and no gesture hacks.
    var h = document.querySelector('.fuel-header');
    var sc = document.getElementById('scroller');
    function onScroll(){ h.classList.toggle('scrolled', sc.scrollTop > 2); }
    sc.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  })();
</script>
</body>
</html>
