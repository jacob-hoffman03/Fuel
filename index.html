<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Fuel v2 · 2026.10.04-d · light mode · header + Health status panel · sticky frosted header · left pill shell -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf0f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fuel</title>
<style>
  :root{
    --bg:#edf0f5;
    --sheet:#ffffff;
    --card:#edf0f5;
    --text:#191d23;
    --text-dim:#5b6470;
    --accent:#2f7cf6;
    --pill:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
  }
  header.fuel-header{
    position:sticky;
    top:0;
    z-index:50;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:calc(env(safe-area-inset-top, 0px) + 36px) 20px 18px;
    transition:background .25s ease;
  }
  header.fuel-header.scrolled{
    background:rgba(237,240,245,.72);
    -webkit-backdrop-filter:blur(18px) saturate(1.5);
    backdrop-filter:blur(18px) saturate(1.5);
  }
  .fuel-header .slot-left{display:flex;justify-content:flex-start;min-width:44px}
  .stat-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:#ffffff;
    border:1px solid rgba(20,30,45,.08);
    box-shadow:0 1px 4px rgba(20,30,45,.08);
    border-radius:999px;
    padding:10px 16px;
    font-size:17px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
  }
  .stat-pill svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .stat-pill .badge{fill:#fff}
  .stat-pill .ph{color:var(--text-dim)}
  .fuel-header .slot-date{
    text-align:center;
    font-size:17px;
    font-weight:600;
    letter-spacing:.2px;
    white-space:nowrap;
    color:var(--text);
  }
  .fuel-header .slot-right{
    display:flex;
    justify-content:flex-end;
    min-width:44px;
  }
  .avatar{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#dde3ea;
    border:2.5px solid var(--accent);
    box-shadow:0 0 0 3px rgba(47,124,246,.18);
  }
  .avatar svg{width:24px;height:24px;stroke:#5b6470;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  main.sheet{
    background:var(--sheet);
    border-radius:30px 30px 0 0;
    padding:30px 24px calc(env(safe-area-inset-bottom, 0px) + 32px);
    min-height:60dvh;
  }
  .panel-title{
    font-size:31px;
    font-weight:600;
    letter-spacing:-.3px;
    margin-bottom:22px;
  }
  .stat-card{
    background:var(--card);
    border-radius:26px;
    padding:30px 26px;
  }
  .stat-card .label{
    font-size:20px;
    font-weight:500;
    margin-bottom:6px;
  }
  .stat-card .big{
    font-size:42px;
    font-weight:650;
    letter-spacing:-.5px;
    margin-bottom:14px;
  }
  .stat-card .tag{
    display:inline-block;
    background:var(--pill);
    color:var(--text);
    font-size:16px;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
  <header class="fuel-header">
    <div class="slot-left">
      <span class="stat-pill" aria-label="Status">
        <svg viewBox="0 0 24 24">
          <rect x="6" y="2.5" width="10.5" height="19" rx="2.5"/>
          <rect class="badge" x="13.5" y="15.5" width="7" height="4.4" rx="1.2"/>
          <path d="M21.2 16.9v1.6"/>
        </svg>
        <span class="ph">—</span>
      </span>
    </div>
    <div class="slot-date" id="hdrDate"></div>
    <div class="slot-right">
      <div class="avatar" aria-label="Profile">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.6"/>
          <path d="M5 19.5c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/>
        </svg>
      </div>
    </div>
  </header>

  <main class="sheet">
    <h2 class="panel-title">Health status</h2>
    <section class="stat-card">
      <div class="label">Vitals</div>
      <div class="big">0 of 5</div>
      <span class="tag">No data</span>
    </section>
  </main>

<script>
  (function(){
    var d = new Date();
    var s = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
    document.getElementById('hdrDate').textContent = s;
    var h = document.querySelector('.fuel-header');
    function onScroll(){ h.classList.toggle('scrolled', window.scrollY > 2); }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  })();
</script>
</body>
</html>
