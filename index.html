<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Fuel v2 · 2026.10.04-a · header skeleton (left empty / center date / right profile) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fuel</title>
<style>
  :root{
    --bg:#0b0f14;
    --text:#f2f5f9;
    --text-dim:#9aa4b2;
    --accent:#4d9fff;
    --avatar-ring:rgba(77,159,255,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
  }
  header.fuel-header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 20px 14px;
  }
  .fuel-header .slot-left{min-width:44px}
  .fuel-header .slot-date{
    text-align:center;
    font-size:17px;
    font-weight:600;
    letter-spacing:.2px;
    white-space:nowrap;
  }
  .fuel-header .slot-right{
    display:flex;
    justify-content:flex-end;
    min-width:44px;
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #1b2634, #10161e 70%);
    border:1.5px solid var(--avatar-ring);
    box-shadow:0 0 12px 2px var(--avatar-ring), 0 0 28px 6px rgba(77,159,255,.18);
  }
  .avatar svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
  <header class="fuel-header">
    <div class="slot-left"></div>
    <div class="slot-date" id="hdrDate"></div>
    <div class="slot-right">
      <div class="avatar" aria-label="Profile">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.6"/>
          <path d="M5 19.5c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/>
        </svg>
      </div>
    </div>
  </header>

<script>
  (function(){
    var d = new Date();
    var s = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
    document.getElementById('hdrDate').textContent = s;
  })();
</script>
</body>
</html>
