<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Fuel v2 · 2026.10.05-e · v1 calorie panel, functional: reads fuel.v1, dual ring, week nav, zone bar, minis, analysis -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf0f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fuel</title>
<style>
  :root{
    --bg:#edf0f5;
    --sheet:#ffffff;
    --text:#191d23;
    --text-dim:#5b6470;
    --accent:#17a2c4;
    /* intake panel theme (overridden per theme) — v1 dark teal */
    --intake-bg1:#1392ac;
    --intake-bg2:#0b5b74;
    --teal:#0d7f9e;
    --ink:#ffffff;
    --ink-dim:rgba(255,255,255,.74);
    --ink-faint:rgba(255,255,255,.52);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }
  .hidden{display:none!important}
  .app{
    height:100dvh;
    max-width:480px;
    margin:0 auto;
    position:relative;
  }
  .view{position:absolute;inset:0;display:none;overflow:hidden}
  .view.active{display:block;animation:viewIn .22s ease}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .scroller{
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    background:var(--bg);
  }
  /* ---------- home header ---------- */
  header.fuel-header{
    position:sticky;
    top:0;
    z-index:50;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:calc(env(safe-area-inset-top, 0px) + 36px) 20px 18px;
    transition:background .25s ease;
  }
  header.fuel-header.scrolled{
    background:rgba(237,240,245,.72);
    -webkit-backdrop-filter:blur(18px) saturate(1.5);
    backdrop-filter:blur(18px) saturate(1.5);
  }
  .fuel-header .slot-left{display:flex;justify-content:flex-start;min-width:44px}
  .stat-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:#ffffff;
    border:1px solid rgba(20,30,45,.08);
    box-shadow:0 1px 4px rgba(20,30,45,.08);
    border-radius:999px;
    padding:10px 16px;
    font-size:17px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
  }
  .stat-pill svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .stat-pill .badge{fill:#fff}
  .stat-pill .ph{color:var(--text-dim)}
  .fuel-header .slot-date{
    text-align:center;
    font-size:17px;
    font-weight:600;
    letter-spacing:.2px;
    white-space:nowrap;
    color:var(--text);
  }
  .fuel-header .slot-right{
    display:flex;
    justify-content:flex-end;
    min-width:44px;
  }
  .avatar{
    position:relative;
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#dde3ea;
    border:2.5px solid var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    cursor:pointer;overflow:hidden;
  }
  .avatar svg{width:24px;height:24px;stroke:#5b6470;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  main.sheet{
    background:var(--sheet);
    border-radius:30px 30px 0 0;
    padding:30px 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    min-height:60dvh;
  }
  /* ---------- Today's Intake calorie panel ---------- */
  .intake-card{
    position:relative;
    overflow:hidden;
    border-radius:36px;
    padding:24px 16px 26px;
    background:linear-gradient(165deg,var(--intake-bg1) 0%,var(--intake-bg2) 100%);
    color:var(--ink);
    margin-bottom:10px;
    box-shadow:0 10px 26px rgba(3,32,43,.38);
  }
  .intake-blob{
    position:absolute;top:-78px;right:-78px;width:230px;height:230px;border-radius:50%;
    background:rgba(255,255,255,.10);
    pointer-events:none;
  }
  .intake-head{
    position:relative;
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:12px;
  }
  .intake-head h3{font-size:22px;font-weight:700;letter-spacing:-.2px}
  .intake-head .intake-date{font-size:14px;font-weight:600;color:var(--ink-dim)}
  .week-strip{position:relative;display:flex;align-items:center;margin-bottom:10px}
  .wk-arrow{
    background:none;border:0;color:var(--ink-faint);
    font-size:21px;font-weight:700;padding:10px 6px;cursor:pointer;line-height:1;
  }
  .wk-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
  .wk-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
  .wk-day .dow{font-size:13px;font-weight:600;color:var(--ink-faint)}
  .wk-day .dnum{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;color:var(--ink-dim);
  }
  .wk-day.today .dow{color:var(--ink)}
  .wk-day.today .dnum{background:#fff;color:color-mix(in srgb, var(--accent) 72%, black);box-shadow:0 3px 10px color-mix(in srgb, var(--accent) 38%, transparent)}
  .wk-day .dot{width:5px;height:5px;border-radius:50%;margin-top:1px}
  .rings-row{
    position:relative;
    display:flex;align-items:center;justify-content:space-between;
    margin:4px 0 20px;
  }
  .mini-col{display:flex;flex-direction:column;gap:16px}
  .mini-ring{position:relative;width:58px;height:58px}
  .mini-ring svg{width:58px;height:58px;transform:rotate(-90deg);display:block}
  .mini-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .mini-center .mv{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .mini-center .ml{font-size:8px;font-weight:700;letter-spacing:.8px;color:var(--ink-dim)}
  .big-ring{position:relative;width:155px;height:155px;flex:none}
  .big-ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .big-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  }
  .big-center .bl{font-size:14px;font-weight:600;color:var(--ink-dim);letter-spacing:.5px;margin-bottom:2px}
  .big-center .bv{font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1.05}
  .big-center .bs{font-size:17px;font-weight:700;margin-top:5px;white-space:nowrap}
  .big-center .bs2{font-size:15px;font-weight:700;color:var(--ink-dim);white-space:nowrap}
  .goal-line{position:relative;font-size:20px;font-weight:700;margin-bottom:12px}
  .goal-row{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .goal-bar{position:relative;flex:1;height:15px;border-radius:999px;background:rgba(255,255,255,.22)}
  .goal-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ff5a3c,#ff9a3c)}
  .goal-tick{
    position:absolute;top:-3px;bottom:-3px;left:100%;width:3px;border-radius:2px;
    background:#0a2e3d;transform:translateX(-50%);
  }
  .goal-info{
    flex:none;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:#fff;
  }
  .nutrition-link{
    position:relative;text-align:center;
    font-size:22px;font-weight:800;letter-spacing:-.3px;cursor:pointer;
  }
  .wk-day:disabled{opacity:.45}
  .wk-day.sel .dnum{outline:2px solid rgba(255,255,255,.65);outline-offset:3px}
  .wk-day .dot.log{background:#fff}
  .wk-day .dot.now{background:#fff}
  .todayrow{display:flex;justify-content:center;margin:0 0 10px}
  .todaypill{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:13px;font-weight:700;padding:7px 18px;border-radius:999px;cursor:pointer}
  .mini-ring{background:none;border:0;padding:0;cursor:pointer}
  .goal-line b{font-weight:800}
  .bs2.on{color:#ffb03a}
  /* ---------- bottom sheet (zone + score details) ---------- */
  .sheet-back{position:fixed;inset:0;background:rgba(8,18,26,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
  .sheet-back.open{opacity:1;pointer-events:auto}
  .bsheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:24px 24px 0 0;
    padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translateY(105%);transition:transform .26s ease;max-height:78dvh;overflow-y:auto;color:var(--text)}
  .bsheet.open{transform:none}
  .sheet-grab{width:44px;height:5px;border-radius:3px;background:#dde2ea;margin:2px auto 14px}
  .irow{font-size:14.5px;line-height:1.55;color:#3c4450;margin-bottom:10px}
  .irow b{color:var(--text)}
  .zonenow{margin-bottom:14px}
  .zonenow b{font-size:19px}
  .zonenow p{font-size:14.5px;color:#3c4450;margin-top:4px;line-height:1.55}
  .zonerow{display:flex;gap:12px;margin-bottom:14px}
  .zdot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:4px}
  .zonerow b{font-size:15.5px}
  .zrange{font-weight:500;color:#6b7482;font-size:13.5px}
  .zonerow p{font-size:14px;color:#3c4450;margin-top:3px;line-height:1.55}
  .zonefoot{font-size:13px;color:#6b7482;line-height:1.55;border-top:1px solid #eef1f5;padding-top:12px}
  /* ---------- nutrition analysis view ---------- */
  .ana-card{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,30,45,.06)}
  .ana-dark{background:linear-gradient(165deg,var(--intake-bg1),var(--intake-bg2));color:#fff}
  .ana-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .ana-lab{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.75)}
  .ana-top b{font-size:34px;font-weight:800;letter-spacing:-.5px}
  .ana-goal{font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
  .ana-ring{width:168px;margin:6px auto 4px}
  .ana-ring svg{width:100%;display:block}
  table.ameal{width:100%;border-collapse:collapse;margin-top:8px}
  table.ameal td{padding:8px 2px;font-size:14.5px;font-weight:600;border-top:1px solid rgba(255,255,255,.16)}
  table.ameal tr:first-child td{border-top:0}
  table.ameal td:nth-child(2),table.ameal td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
  .mdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
  .ana-note{font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.88);margin-top:10px}
  .ana-note b{color:#fff}
  .ana-h{font-size:18px;font-weight:800;margin-bottom:12px}
  .amac{margin-bottom:12px}
  .amac-top{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:6px}
  .amac-top i{font-style:normal;font-weight:500;color:var(--text-dim)}
  .amac-bar{height:10px;border-radius:6px;background:#eef1f5;overflow:hidden}
  .amac-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff))}
  /* ---------- profile / theme pages ---------- */
  .page{padding:0 20px calc(env(safe-area-inset-bottom, 0px) + 30px)}
  .page-bar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    margin:0 -20px;padding:calc(env(safe-area-inset-top, 0px) + 10px) 20px 12px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .done-btn{background:none;border:0;color:var(--accent);font-size:17px;font-weight:600;cursor:pointer;padding:8px 4px}
  .back-btn{background:none;border:0;color:var(--accent);font-size:17px;font-weight:600;cursor:pointer;padding:8px 4px}
  .page-bar .page-title{font-size:17px;font-weight:600}
  .page-bar .bar-sp{width:64px}
  .profile-hero{
    background:#fff;border-radius:28px;padding:24px 22px;
    display:flex;align-items:center;gap:18px;margin:12px 0 8px;
    box-shadow:0 4px 14px rgba(20,30,45,.06);
  }
  .p-avatar{
    position:relative;width:76px;height:76px;flex:none;border-radius:50%;
    border:3px solid var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
    background:#dde3ea;display:flex;align-items:center;justify-content:center;
    cursor:pointer;overflow:visible;
  }
  .p-avatar .glyph{display:flex;align-items:center;justify-content:center}
  .p-avatar .glyph svg{width:38px;height:38px;stroke:#5b6470;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .p-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .p-pencil{
    position:absolute;right:-5px;bottom:-5px;width:30px;height:30px;border-radius:50%;
    background:#fff;border:1px solid rgba(20,30,45,.10);
    box-shadow:0 2px 6px rgba(20,30,45,.18);
    display:flex;align-items:center;justify-content:center;
  }
  .p-pencil svg{width:15px;height:15px;stroke:#191d23;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .p-name{font-size:23px;font-weight:700;letter-spacing:-.3px}
  .p-sub{font-size:14px;color:var(--text-dim);font-weight:500;margin-top:3px}
  .p-remove{
    display:block;margin:2px auto 16px;background:none;border:0;
    color:var(--text-dim);font-size:14px;font-weight:600;cursor:pointer;padding:6px;
  }
  .menu-group{display:flex;flex-direction:column;gap:12px}
  .menu-row{
    background:#fff;border:0;border-radius:22px;padding:16px;
    display:flex;align-items:center;gap:14px;width:100%;
    font-size:17px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;
    box-shadow:0 4px 14px rgba(20,30,45,.05);
  }
  .menu-ic{
    width:40px;height:40px;border-radius:13px;background:var(--bg);flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .menu-ic svg{width:22px;height:22px;stroke:#3c4654;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .menu-chev{margin-left:auto;color:#9aa4b2;font-size:22px;font-weight:600;line-height:1}
  .theme-title{font-size:28px;font-weight:700;letter-spacing:-.4px;margin:12px 0 6px}
  .theme-hint{font-size:15px;color:var(--text-dim);font-weight:500;margin-bottom:18px}
  .swatches{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .swatch{
    border:2.5px solid transparent;background:#fff;border-radius:22px;padding:12px;
    cursor:pointer;text-align:left;box-shadow:0 4px 14px rgba(20,30,45,.05);
  }
  .swatch.sel{border-color:var(--sw-ring)}
  .sw-preview{height:76px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .sw-ring{
    width:42px;height:42px;border-radius:50%;
    border:8px solid #fff;border-top-color:rgba(255,255,255,.35);
    transform:rotate(-45deg);
  }
  .sw-foot{display:flex;align-items:center;justify-content:space-between}
  .sw-name{font-size:15px;font-weight:700}
  .sw-check{
    display:none;width:24px;height:24px;border-radius:50%;
    background:var(--sw-ring);align-items:center;justify-content:center;
  }
  .sw-check svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .swatch.sel .sw-check{display:flex}
  .swatch.custom{grid-column:span 2}
  .custom-preview{position:relative;overflow:hidden}
  #customColor{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .sw-hex{font-size:13px;font-weight:700;color:var(--text-dim);letter-spacing:.5px}
</style>
</head>
<body>
  <div class="app">

    <!-- ============ HOME ============ -->
    <section class="view active" id="view-home">
      <div class="scroller" id="scroller">
        <header class="fuel-header">
          <div class="slot-left">
            <span class="stat-pill" aria-label="Status">
              <svg viewBox="0 0 24 24">
                <rect x="6" y="2.5" width="10.5" height="19" rx="2.5"/>
                <rect class="badge" x="13.5" y="15.5" width="7" height="4.4" rx="1.2"/>
                <path d="M21.2 16.9v1.6"/>
              </svg>
              <span class="ph">—</span>
            </span>
          </div>
          <div class="slot-date" id="hdrDate"></div>
          <div class="slot-right">
            <div class="avatar" id="hdrAvatar" aria-label="Profile">
              <span class="glyph">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="3.6"/>
                  <path d="M5 19.5c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/>
                </svg>
              </span>
            </div>
          </div>
        </header>

        <main class="sheet">
          <section class="intake-card" aria-label="Today's intake">
            <div class="intake-blob"></div>
            <div class="intake-head">
              <h3>Today's Intake</h3>
              <span class="intake-date" id="intakeDate"></span>
            </div>
            <div class="week-strip">
              <button class="wk-arrow" id="wkPrev" aria-label="Previous week">‹</button>
              <div class="wk-days" id="wkDays"></div>
              <button class="wk-arrow" id="wkNext" aria-label="Next week">›</button>
            </div>
            <div class="todayrow" id="todayRow" style="display:none">
              <button class="todaypill" id="todayPill">Today</button>
            </div>
            <div class="rings-row">
              <div class="mini-col">
                <button class="mini-ring" id="fatigueWheel" aria-label="Fatigue details">
                  <svg viewBox="0 0 84 84">
                    <circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>
                    <circle id="fatigueArc" cx="42" cy="42" r="36" fill="none" stroke="#2fe3b6" stroke-width="9" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
                  </svg>
                  <span class="mini-center"><span class="mv" id="fatigueNum">–</span><span class="ml">FATIGUE</span></span>
                </button>
                <button class="mini-ring" id="bloatWheel" aria-label="Bloat details">
                  <svg viewBox="0 0 84 84">
                    <circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>
                    <circle id="bloatArc" cx="42" cy="42" r="36" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
                  </svg>
                  <span class="mini-center"><span class="mv" id="bloatNum">–</span><span class="ml">BLOAT</span></span>
                </button>
              </div>
              <div class="big-ring">
                <svg viewBox="0 0 128 128">
                  <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="11"/>
                  <circle id="ringMaint" cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="351.9"/>
                  <circle id="ringSurpTrack" cx="64" cy="64" r="46" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5"/>
                  <circle id="ringSurp" cx="64" cy="64" r="46" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/>
                </svg>
                <div class="big-center">
                  <span class="bl">Eaten</span>
                  <span class="bv" id="calEaten">0</span>
                  <span class="bs" id="flagKcal"></span>
                  <span class="bs2" id="flagSur"></span>
                </div>
              </div>
              <div class="mini-col">
                <button class="mini-ring" id="adhWheel" aria-label="Adherence details">
                  <svg viewBox="0 0 84 84">
                    <circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>
                    <circle id="adhArc" cx="42" cy="42" r="36" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
                  </svg>
                  <span class="mini-center"><span class="mv" id="adhNum">–</span><span class="ml">ADHERENCE</span></span>
                </button>
              </div>
            </div>
            <div class="goal-line"><b id="progPct">0%</b> of daily goal</div>
            <div class="goal-row">
              <div class="goal-bar">
                <div class="goal-fill" id="spFill"></div>
                <div class="goal-tick" id="spMark"></div>
              </div>
              <button class="goal-info" id="zoneInfo" aria-label="Zone details">i</button>
            </div>

<script>
  (function(){
    "use strict";
    var now = new Date();

    /* ---------- themes ---------- */
    var THEMES = {
      teal:  {name:'Teal',  bg1:'#1392ac', bg2:'#0b5b74', ink:'#ffffff', inkDim:'rgba(255,255,255,.74)', inkFaint:'rgba(255,255,255,.52)', accent:'#17a2c4'},
      blue:  {name:'Blue',  bg1:'#2f74d8', bg2:'#1b4c96', ink:'#ffffff', inkDim:'rgba(255,255,255,.74)', inkFaint:'rgba(255,255,255,.52)', accent:'#5aa0ff'},
      green: {name:'Green', bg1:'#26a862', bg2:'#146636', ink:'#ffffff', inkDim:'rgba(255,255,255,.74)', inkFaint:'rgba(255,255,255,.52)', accent:'#3cc474'},
      purple:{name:'Purple',bg1:'#7d63d4', bg2:'#4f3898', ink:'#ffffff', inkDim:'rgba(255,255,255,.74)', inkFaint:'rgba(255,255,255,.52)', accent:'#9a80e6'},
      orange:{name:'Orange',bg1:'#e58e36', bg2:'#9e5c1d', ink:'#ffffff', inkDim:'rgba(255,255,255,.76)', inkFaint:'rgba(255,255,255,.54)', accent:'#f2a45a'},
      rose:  {name:'Rose',  bg1:'#d8648e', bg2:'#943652', ink:'#ffffff', inkDim:'rgba(255,255,255,.74)', inkFaint:'rgba(255,255,255,.52)', accent:'#e885a8'}
    };
    function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function mix(h1,h2,amt){
      var a=hx(h1),b=hx(h2);
      return '#'+a.map(function(v,i){
        var n=Math.round(v+(b[i]-v)*amt).toString(16);
        return n.length<2?'0'+n:n;
      }).join('');
    }
    function setVars(t){
      var r = document.documentElement.style;
      r.setProperty('--ink', t.ink);
      r.setProperty('--ink-dim', t.inkDim);
      r.setProperty('--ink-faint', t.inkFaint);
      r.setProperty('--accent', t.accent);
      r.setProperty('--intake-bg1', t.bg1);
      r.setProperty('--intake-bg2', t.bg2);
    }
    function markSelected(id){
      var sws = document.querySelectorAll('.swatch');
      for (var i = 0; i < sws.length; i++){
        sws[i].classList.toggle('sel', sws[i].getAttribute('data-theme') === id);
      }
    }
    function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
    function applyTheme(id){
      var t = THEMES[id] || THEMES.teal;
      setVars(t);
      save('fuel2_theme', id);
      markSelected(id);
    }
    function buildCustom(hex){
      return {name:'Custom',
        bg1:mix(hex,'#000000',.15), bg2:mix(hex,'#000000',.40),
        ink:'#ffffff', inkDim:'rgba(255,255,255,.74)', inkFaint:'rgba(255,255,255,.52)',
        accent:mix(hex,'#ffffff',.30)};
    }
    function paintCustom(hex){
      hex = (hex || '#0a5f77').toLowerCase();
      var t = buildCustom(hex);
      var cb = document.querySelector('.swatch.custom');
      if (cb) cb.style.setProperty('--sw-ring', mix(hex,'#ffffff',.30));
      var prev = document.getElementById('customPreview');
      if (prev) prev.style.background = 'linear-gradient(135deg,' + t.bg1 + ',' + t.bg2 + ')';
      var hexEl = document.getElementById('customHex');
      if (hexEl) hexEl.textContent = hex.toUpperCase();
      var inp = document.getElementById('customColor');
      if (inp && inp.value.toLowerCase() !== hex) inp.value = hex;
    }
    function applyCustom(hex){
      hex = (hex || '#0a5f77').toLowerCase();
      setVars(buildCustom(hex));
      save('fuel2_theme', 'custom');
      save('fuel2_custom', hex);
      paintCustom(hex);
      markSelected('custom');
    }
    var swWrap = document.getElementById('swatches');
    Object.keys(THEMES).forEach(function(id){
      var t = THEMES[id];
      var b = document.createElement('button');
      b.className = 'swatch';
      b.setAttribute('data-theme', id);
      b.style.setProperty('--sw-ring', t.accent);
      b.innerHTML =
        '<span class="sw-preview" style="background:linear-gradient(135deg,' + t.bg1 + ',' + t.bg2 + ')">' +
          '<span class="sw-ring"></span></span>' +
        '<span class="sw-foot"><span class="sw-name">' + t.name + '</span>' +
        '<span class="sw-check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>';
      b.addEventListener('click', function(){ applyTheme(id); });
      swWrap.appendChild(b);
    });
    var savedTheme = null, savedCustom = null;
    try{ savedTheme = localStorage.getItem('fuel2_theme'); savedCustom = localStorage.getItem('fuel2_custom'); }catch(e){}
    // custom swatch (wide row under the presets)
    var cb = document.createElement('button');
    cb.className = 'swatch custom';
    cb.setAttribute('data-theme', 'custom');
    cb.innerHTML =
      '<span class="sw-preview custom-preview" id="customPreview">' +
        '<span class="sw-ring" id="customRing"></span>' +
        '<input type="color" id="customColor" value="#0a5f77" aria-label="Pick a custom color"></span>' +
      '<span class="sw-foot"><span class="sw-name">Custom</span>' +
      '<span class="sw-hex" id="customHex">#0A5F77</span></span>';
    cb.addEventListener('click', function(e){
      if (e.target && e.target.id === 'customColor') return; // picker handles it
      applyCustom(document.getElementById('customColor').value);
    });
    swWrap.appendChild(cb);
    document.getElementById('customColor').addEventListener('input', function(e){ applyCustom(e.target.value); });
    paintCustom(savedCustom || '#0a5f77');
    if (savedTheme === 'custom' && savedCustom){ applyCustom(savedCustom); }
    else { applyTheme(savedTheme || 'teal'); }

    /* ---------- navigation ---------- */
    function show(id){
      var vs = document.querySelectorAll('.view');
      for (var i = 0; i < vs.length; i++){
        vs[i].classList.toggle('active', vs[i].id === id);
      }
    }
    document.getElementById('hdrAvatar').addEventListener('click', function(){ show('view-profile'); });
    document.getElementById('profileDone').addEventListener('click', function(){ show('view-home'); });
    document.getElementById('themeRow').addEventListener('click', function(){ show('view-theme'); });
    document.getElementById('themeBack').addEventListener('click', function(){ show('view-profile'); });

    /* ---------- profile photo ---------- */
    var pfpInput = document.getElementById('pfpInput');
    function setPfp(url){
      ['hdrAvatar','profileAvatar'].forEach(function(id){
        var el = document.getElementById(id);
        var old = el.querySelector('img');
        if (old) old.remove();
        var g = el.querySelector('.glyph');
        if (url){
          var im = document.createElement('img');
          im.src = url; im.alt = 'Profile photo';
          el.insertBefore(im, el.firstChild);
          if (g) g.style.display = 'none';
        } else if (g){ g.style.display = ''; }
      });
      document.getElementById('pfpRemove').classList.toggle('hidden', !url);
    }
    document.getElementById('profileAvatar').addEventListener('click', function(){ pfpInput.click(); });
    pfpInput.addEventListener('change', function(){
      var f = pfpInput.files && pfpInput.files[0];
      if (!f) return;
      var img = new Image();
      img.onload = function(){
        var s = 192, side = Math.min(img.width, img.height);
        var c = document.createElement('canvas');
        c.width = c.height = s;
        c.getContext('2d').drawImage(img,
          (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, s, s);
        var url = c.toDataURL('image/jpeg', 0.85);
        try{ localStorage.setItem('fuel2_pfp', url); }catch(e){}
        setPfp(url);
        pfpInput.value = '';
        try{ URL.revokeObjectURL(img.src); }catch(e){}
      };
      img.src = URL.createObjectURL(f);
    });
    document.getElementById('pfpRemove').addEventListener('click', function(){
      try{ localStorage.removeItem('fuel2_pfp'); }catch(e){}
      setPfp(null);
    });
    var savedPfp = null;
    try{ savedPfp = localStorage.getItem('fuel2_pfp'); }catch(e){}
    setPfp(savedPfp);

    /* ============ Fuel v1 engine (read-only port) ============
       Reads Jay's real log from the same localStorage key v1 uses
       ("fuel.v1"), so his days, foods and goals show up here. This port
       never writes back: no save(), no day() auto-create — pure reads. */
    var MEALS = ["breakfast","lunch","dinner","snacks","supplements"];
    var FOOD_MEALS = ["breakfast","lunch","dinner","snacks"];
    var MEAL_SEG = {breakfast:"#ffdca8", lunch:"#ffab3d", dinner:"#ff8f3d", snacks:"#ff7f2a", supplements:"#8b8bf5"};
    var MEAL_LABEL = {breakfast:"Breakfast", lunch:"Lunch", dinner:"Dinner", snacks:"Snacks", supplements:"Supplements"};
    var WORK_WEEKDAYS_DEF = [1,3,5,6];
    var ACT_TIERS = [
      {key:"sedentary", pal:1.2, label:"Sedentary"},
      {key:"light", pal:1.375, label:"Light"},
      {key:"moderate", pal:1.465, label:"Moderate"},
      {key:"active", pal:1.55, label:"Active"},
      {key:"very", pal:1.725, label:"Very active"},
      {key:"extra", pal:1.9, label:"Extra active"}
    ];
    function actPAL(p){
      for (var i=0;i<ACT_TIERS.length;i++) if (ACT_TIERS[i].key === (p && p.activityKey)) return ACT_TIERS[i].pal;
      return ACT_TIERS[2].pal;
    }
    var NUTR_ALIASES = [
      [/vitamin\s*d|cholecalciferol/i,"Vitamin D"], [/vitamin\s*a|retinol/i,"Vitamin A"],
      [/vitamin\s*b6|pyridoxine/i,"Vitamin B6"], [/vitamin\s*b12|cobalamin/i,"Vitamin B12"],
      [/vitamin\s*c|ascorbic/i,"Vitamin C"], [/vitamin\s*e|tocopherol|tocotrienol/i,"Vitamin E"],
      [/vitamin\s*k/i,"Vitamin K"], [/thiamin|vitamin\s*b1/i,"Thiamin"], [/riboflavin|vitamin\s*b2/i,"Riboflavin"],
      [/niacin|nicotin|vitamin\s*b3/i,"Niacin"], [/folate|folic|vitamin\s*b9/i,"Folate"],
      [/biotin|vitamin\s*b7/i,"Biotin"], [/pantothenic|vitamin\s*b5/i,"Pantothenic acid"],
      [/calcium/i,"Calcium"], [/iron/i,"Iron"], [/magnesium/i,"Magnesium"], [/phosphorus/i,"Phosphorus"],
      [/iodine/i,"Iodine"], [/zinc/i,"Zinc"], [/selenium/i,"Selenium"], [/copper/i,"Copper"],
      [/manganese/i,"Manganese"], [/chromium/i,"Chromium"], [/molybdenum/i,"Molybdenum"],
      [/potassium/i,"Potassium"], [/\bsodium\b/i,"Sodium"], [/chloride/i,"Chloride"],
      [/fiber|fibre/i,"Fiber"], [/added\s*sugars?/i,"Added Sugars"], [/sugar/i,"Sugars"],
      [/saturated\s*fat/i,"Saturated Fat"], [/cholesterol/i,"Cholesterol"], [/creatine/i,"Creatine"]
    ];
    var S = (function(){
      try{
        var s = JSON.parse(localStorage.getItem("fuel.v1"));
        if (s && typeof s === "object"){
          if (!s.days || typeof s.days !== "object") s.days = {};
          if (!s.goals || typeof s.goals !== "object") s.goals = {};
          return s;
        }
      }catch(e){}
      return {days:{}, goals:{}};
    })();
    function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
    function todayStr(){ return dstr(new Date()); }
    function addDays(ds, n){ var d = new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
    function r1(n){ return Math.round(n*10)/10; }
    function barW(v,goal){ return (goal>0 ? Math.min(v/goal*100,100) : 0)+"%"; }
    var dayOffset = 0, weekOff = 0;
    function viewDate(){ var d = new Date(); d.setDate(d.getDate()+dayOffset); return dstr(d); }
    function emptyDay(){ return {meals:{breakfast:[],lunch:[],dinner:[],snacks:[],supplements:[]}, waterOz:0}; }
    function getDay(k){ return S.days[k] || emptyDay(); }
    function totals(k){
      var d = getDay(k), t = {cal:0,p:0,c:0,f:0};
      MEALS.forEach(function(m){ ((d.meals||{})[m]||[]).forEach(function(e){ t.cal+=e.cal||0; t.p+=e.p||0; t.c+=e.c||0; t.f+=e.f||0; }); });
      return t;
    }
    function mealCals(k){
      var d = getDay(k), o = {};
      MEALS.forEach(function(m){ o[m] = ((d.meals||{})[m]||[]).reduce(function(a,e){ return a+(e.cal||0); },0); });
      return o;
    }
    function canonNutr(name){
      var t = String(name||"").trim(), i;
      for (i=0;i<NUTR_ALIASES.length;i++) if (NUTR_ALIASES[i][0].test(t)) return NUTR_ALIASES[i][1];
      return t.replace(/\w\S*/g, function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); });
    }
    function mealMacros(ds){
      var d = S.days[ds] || {meals:{}}, out = {};
      MEALS.forEach(function(m){
        var t = {cal:0,p:0,c:0,f:0,fiber:0,sugars:0,sodium:0,pot:0};
        ((d.meals||{})[m]||[]).forEach(function(e){
          t.cal+=e.cal||0; t.p+=e.p||0; t.c+=e.c||0; t.f+=e.f||0;
          (e.nutrs||[]).forEach(function(x){
            var n = canonNutr(x.n), u = String(x.u||"").toLowerCase();
            var mg = u==="g" ? x.amt*1000 : u==="mcg" ? x.amt/1000 : x.amt;
            if (n==="Fiber") t.fiber += mg/1000;
            else if (n==="Sugars"||n==="Added Sugars") t.sugars += mg/1000;
            else if (n==="Sodium") t.sodium += mg;
            else if (n==="Potassium") t.pot += mg;
          });
        });
        out[m] = t;
      });
      return out;
    }
    function alcData(d){
      var a = d.alc;
      if (typeof a === "number") a = {shot:0, beer:a, cocktail:0};
      a = Object.assign({shot:0, beer:0, cocktail:0}, a||{});
      return {a:a, std:a.shot*1+a.beer*1+a.cocktail*1.5, kcal:a.shot*97+a.beer*150+a.cocktail*200};
    }
    function dayHasXW(ds){
      var d = S.days[ds||viewDate()]; if(!d) return false;
      return MEALS.some(function(m){ return ((d.meals||{})[m]||[]).some(function(e){ return e.xw; }); });
    }
    function waterCalc(ds){
      var g = S.goals || {};
      if (g.water>0) return {target:g.water, manual:true};
      if (!(g.maintenance>0)) return {target:0, manual:false, unset:true};
      var tdee = g.maintenance, pal = actPAL(g.profile);
      var perKcal = pal>=1.7 ? 1.2 : 1.0;
      var ml = tdee*perKcal*0.8 + (dayHasXW(ds) ? 500 : 0);
      var tier = "Moderate";
      for (var i=0;i<ACT_TIERS.length;i++) if (ACT_TIERS[i].key === ((g.profile||{}).activityKey)) tier = ACT_TIERS[i].label;
      return {target:Math.max(4, Math.min(24, Math.round(ml/240))), manual:false, tier:tier};
    }
    function workDays(){
      return Array.isArray(S.workDays) ? S.workDays.filter(function(x){ return x>=0&&x<=6; }) : WORK_WEEKDAYS_DEF.slice();
    }
    function isWorkDayAuto(kstr){ return workDays().indexOf(new Date(kstr+"T12:00:00").getDay())>=0; }
    function dayType(kstr){
      var ov = (S.dayTypeOv||{})[kstr];
      if (ov==="work" || ov==="off") return ov;
      return isWorkDayAuto(kstr) ? "work" : "off";
    }
    function mealTimeStats(meal, work){
      var a = (S.mealTimes && S.mealTimes[meal]) || [];
      var f = a.filter(function(o){
        if (!o || typeof o !== "object" || typeof o.t !== "number") return false;
        return work==null ? true : o.w === (work?1:0);
      });
      if (!f.length) return {avg:0, n:0};
      var sx=0, sy=0;
      f.forEach(function(o){ var r2=o.t/1440*2*Math.PI; sx+=Math.cos(r2); sy+=Math.sin(r2); });
      var avg = Math.atan2(sy/f.length, sx/f.length)/(2*Math.PI)*1440;
      avg = ((avg%1440)+1440)%1440;
      return {avg:avg, n:f.length};
    }
    function fmtClock(mins){
      mins = ((Math.round(mins)%1440)+1440)%1440;
      var h = Math.floor(mins/60), m = mins%60, ap = h>=12?"PM":"AM";
      h = h%12; if (h===0) h=12;
      return h+":"+String(m).padStart(2,"0")+" "+ap;
    }
    function goalTotal(){ var g = S.goals||{}; return (g.maintenance>0?g.maintenance:0)+(g.surplus>0?g.surplus:0); }
    function fiberTarget(){
      var ct = ((S.goals||{}).nutrTargets||{})["Fiber"];
      if (ct && ct.val>0) return ct.val;
      var tot = goalTotal();
      return tot>0 ? Math.round(14*tot/1000) : 0;
    }
    function statusInfo(){
      var k = viewDate(), t = totals(k), g = S.goals||{};
      var mCal = g.maintenance>0?g.maintenance:0, sAdd = g.surplus>0?g.surplus:0, tCal = mCal+sAdd, eCal = t.cal;
      var defc = Math.round(mCal-eCal), dpct = mCal>0?Math.round(defc/mCal*100):0;
      var pAte = Math.round(t.p||0), pGoal = g.protein||0, lowP = pGoal>0 && pAte < pGoal*0.8;
      var cls, title, det, grad;
      if (mCal<=0){
        cls="unset"; title="Set your goals"; grad="linear-gradient(90deg,#8a8aa3,#b9b9d6)";
        det = "Add your profile in Goals to get a maintenance target — then this bar tracks your zone.";
      } else if (eCal < mCal){
        cls="deficit"; title="Calorie deficit"; grad="linear-gradient(90deg,#ff3b30,#ff8a5c)";
        var tier = defc>=500 ? "deep enough to stall muscle gain" : defc>=250 ? "big enough to slow gains if it keeps up" : "small gap — closable with a snack";
        det = defc.toLocaleString()+" cal under maintenance ("+dpct+"%) — "+tier;
        if (lowP) det += ". Protein only "+pAte+"g of "+pGoal+"g — low protein makes a deficit cost more muscle";
      } else if (eCal < tCal){
        cls="surplus"; title="Past maintenance"; grad="linear-gradient(90deg,#ff9f43,#ffd23d)";
        det = Math.round(tCal-eCal).toLocaleString()+" cal to your daily target";
        if (lowP) det += " · protein "+pAte+"g of "+pGoal+"g";
      } else {
        cls="ontrack"; title="On track"; grad="linear-gradient(90deg,#1faa5c,#66e39a)";
        det = "+"+Math.round(eCal-mCal).toLocaleString()+" over maintenance — gaining zone";
      }
      return {cls:cls, title:title, det:det, grad:grad, eCal:eCal, mCal:mCal, tCal:tCal};
    }
    function trainDay(ds){ return {}; } /* training log isn't ported — panel never reads .trained */
    function dayTotals(ds){
      var d = S.days[ds] || {};
      var t = totals(ds), mm = mealMacros(ds);
      var n = {fiber:0, sugars:0, sodium:0, pot:0};
      MEALS.forEach(function(m){ n.fiber+=mm[m].fiber; n.sugars+=mm[m].sugars; n.sodium+=mm[m].sodium; n.pot+=mm[m].pot; });
      var w = waterCalc(ds);
      var waterOz = Math.round((d.waterOz||0)*10)/10;
      var foodLogged = t.cal>0;
      return {ds:ds, logged:foodLogged||waterOz>0, foodLogged:foodLogged, cal:t.cal, p:t.p, c:t.c, f:t.f,
        fiber:n.fiber, sugars:n.sugars, sodium:n.sodium, pot:n.pot, waterOz:waterOz,
        waterRatio:(w.target>0 && !w.unset) ? waterOz/(w.target*8) : null,
        alcStd:alcData(d).std, trained:!!trainDay(ds).done};
    }
    function dayHit(ds){
      var t = dayTotals(ds), goal = goalTotal(), pt = (S.goals||{}).protein;
      if (!t.foodLogged || !(goal>0 && pt>0)) return false;
      return t.cal>=goal*0.9 && t.cal<=goal*1.1 && t.p>=pt*0.9;
    }
    function adherenceSeries(n){
      var out = [], m = n||14, i, ds, t;
      for (i=m-1;i>=0;i--){ ds = addDays(todayStr(),-i); t = dayTotals(ds); t.hit = dayHit(ds); out.push(t); }
      return out;
    }
    function adherenceStats(){
      var goal = goalTotal(), pt = (S.goals||{}).protein;
      var food = adherenceSeries(14).filter(function(x){ return x.foodLogged; });
      var hit = food.filter(function(x){ return x.hit; }).length;
      var noGoal = !(goal>0 && pt>0);
      return {n:food.length, hit:hit, pct:(food.length>0 && !noGoal) ? Math.round(hit/food.length*100) : null};
    }
    /* Fatigue estimate — v1's consumption-only model (2026.09.25-e), ported whole:
       base 30 (Steady), moves only on consumed signals: hydration deficit late
       in the day, carb-dominant / big / sugary recent meals, overdue meals,
       yesterday's + today's alcohol, under-fueling. Missing data stays neutral. */
    function tiredLevel(ds){
      ds = ds || todayStr();
      var d = S.days[ds] || {};
      function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
      var pts = 30, why = [];
      var nowD = new Date(), hr = nowD.getHours();
      var w = waterCalc(ds);
      if (w.target>0 && !w.unset){
        var woz = w.target*8, wr = (d.waterOz||0)/woz;
        if (hr>=14){
          if (wr<0.5){ pts+=8; why.push("Water is under half your target and it's past 2pm — even ~1.5% dehydration brings on fatigue (Ganio et al. 2011)."); }
          else if (wr<0.8){ pts+=4; why.push("Water is at "+Math.round(wr*100)+"% of target this afternoon — mild dehydration drags energy down."); }
        }
      }
      var MEAL_AT = {breakfast:8, lunch:12.5, dinner:18.5};
      var wtired = dayType(ds)==="work";
      ["breakfast","lunch","dinner"].forEach(function(m){
        var s = mealTimeStats(m, wtired);
        if (s.n>=3) MEAL_AT[m] = s.avg/60;
      });
      var mm = mealMacros(ds);
      var lastM = null, lastAt = -1, nowMs = Date.now();
      ["dinner","lunch","breakfast"].forEach(function(m){
        ((d.meals||{})[m]||[]).forEach(function(e){
          if (e.t && e.t<=nowMs && nowMs-e.t<2*3600e3){
            var dt = new Date(e.t), h = dt.getHours()+dt.getMinutes()/60;
            if (h>lastAt){ lastAt=h; lastM=m; }
          }
        });
      });
      if (!lastM){
        ["dinner","lunch","breakfast"].forEach(function(m){
          if (mm[m].cal>=200 && MEAL_AT[m]<=hr && MEAL_AT[m]>lastAt){ lastAt = MEAL_AT[m]; lastM = m; }
        });
      }
      if (lastM && (hr-lastAt)<2){
        var x = mm[lastM];
        var carbFrac = x.cal>0 ? (x.c*4)/x.cal : 0;
        var netC = Math.max(0, x.c-x.fiber);
        if (carbFrac>=0.6 && netC>=40){
          var blunted = x.p>=20 || x.fiber>=8;
          pts += blunted ? 4 : 8;
          why.push(cap1(lastM)+" was carb-dominant ("+Math.round(netC)+"g net carbs)"+(blunted?" but the protein/fiber blunts the dip":"")+" — glucose quiets the brain's orexin wakefulness neurons for an hour or two (Burdakov et al. 2005, 2006).");
        }
        if (x.cal>=900 || x.f>=40){
          pts+=6;
          why.push(cap1(lastM)+" was a big meal ("+Math.round(x.cal).toLocaleString()+" kcal) — larger solid meals pull sleepiness up with them, whatever the macros (Wells et al. 1997).");
        }
        else if (x.cal>=650){
          pts+=3;
          why.push(cap1(lastM)+" was a hearty one ("+Math.round(x.cal).toLocaleString()+" kcal) — even a moderately big meal deepens the post-meal dip.");
        }
        if ((x.sugars||0)>=60){
          pts+=4;
          why.push(cap1(lastM)+" carried "+Math.round(x.sugars)+"g sugar — past ~60g the crash outweighs the lift, and fatigue climbs within the hour.");
        }
      }
      var overdue = null;
      ["breakfast","lunch","dinner"].forEach(function(m){
        var s = mealTimeStats(m, wtired);
        if (s.n>=5 && (mm[m]||{cal:0}).cal<=0){
          var late = hr - s.avg/60;
          if (late>=1.5 && (!overdue || late>overdue.late)) overdue = {m:m, late:late, at:s.avg};
        }
      });
      if (overdue){
        pts += 4;
        why.push(cap1(overdue.m)+" is overdue — you usually eat around "+fmtClock(overdue.at)+", and running past your own rhythm drags energy down.");
      }
      var yd = addDays(ds,-1);
      var yStd = alcData(S.days[yd]||{}).std, tStd = alcData(d).std;
      var yalc = Math.max(yStd, hr<12 ? tStd : 0);
      if (yalc>0){
        var p = Math.min(18, Math.round(yalc*5));
        pts+=p;
        why.push(Math.round(yalc)+" drink"+(Math.round(yalc)===1?"":"s")+" "+(hr<12&&tStd>yStd?"last night":"yesterday")+" — next-day fatigue runs dose-dependent with evening drinking (Ebrahim et al. 2013).");
      }
      if (hr>=12 && tStd>0){
        var p2 = Math.min(12, Math.round(tStd*4));
        pts+=p2;
        why.push(Math.round(tStd)+" drink"+(Math.round(tStd)===1?"":"s")+" today — alcohol is a sedative; it drags energy down directly, more with every drink.");
      }
      if (hr>=15){
        var goal = goalTotal();
        var ateToday = FOOD_MEALS.some(function(m){ return (((d.meals||{})[m]||[]).length>0); });
        if (goal>0 && ateToday){
          var eaten = 0;
          FOOD_MEALS.forEach(function(m){ eaten += (mm[m]||{cal:0}).cal; });
          var ratio = eaten/goal;
          if (ratio<0.33){ pts+=10; why.push("Only "+Math.round(eaten).toLocaleString()+" kcal so far ("+Math.round(ratio*100)+"% of your goal) — running on fumes drags energy down on its own."); }
          else if (ratio<0.5){ pts+=6; why.push("At "+Math.round(ratio*100)+"% of your calorie goal by "+fmtClock(hr*60)+" — an under-fueled afternoon feels heavier than a fed one."); }
        }
      }
      var score = Math.max(0, Math.min(100, Math.round(pts)));
      var level = score<=19?1:score<=39?2:score<=59?3:score<=79?4:5;
      return {score:score, level:level, label:["","Fresh","Steady","Fading","Heavy","Drained"][level], why:why};
    }
    function bloatScore(ds){
      ds = ds || todayStr();
      var mm = mealMacros(ds), d = S.days[ds] || {waterOz:0};
      var sodium=0, fiber=0, sugars=0, pot=0, big=0, bigFat=0, logged=false;
      MEALS.forEach(function(m){ var x=mm[m]; sodium+=x.sodium; fiber+=x.fiber; sugars+=x.sugars; pot+=x.pot;
        big=Math.max(big,x.cal); bigFat=Math.max(bigFat,x.f); if(x.cal>0) logged=true; });
      if (!logged) return {score:null, why:[], label:"–"};
      var pts = 0, why = [];
      if (sodium>=3500){ pts+=30; why.push(Math.round(sodium).toLocaleString()+"mg sodium — high salt drives water retention and bloating (high-sodium diets raised bloating risk 27%: Peng et al. 2019)."); }
      else if (sodium>=2300){ pts+=16; why.push(Math.round(sodium).toLocaleString()+"mg sodium is over the 2,300mg daily value — expect some water retention."); }
      else if (sodium>=1500){ pts+=7; why.push("Sodium is climbing ("+Math.round(sodium).toLocaleString()+"mg) — watch it if the next meal is salty."); }
      if (pot>=3500 && sodium>=2300){ pts-=8; why.push("Good potassium ("+Math.round(pot).toLocaleString()+"mg) helps flush sodium — blunting the bloat."); }
      var fsum=0, fn=0, i, dd, f, m, e, x, u;
      for (i=1;i<=7;i++){
        dd = S.days[addDays(todayStr(),-i)]; if(!dd) continue;
        f=0;
        for (m=0;m<MEALS.length;m++) (((dd.meals||{})[MEALS[m]])||[]).forEach(function(en){
          (en.nutrs||[]).forEach(function(nx){
            if (canonNutr(nx.n)==="Fiber"){ u=String(nx.u||"").toLowerCase(); f += u==="g"?nx.amt : u==="mg"?nx.amt/1000 : u==="mcg"?nx.amt/1e6 : nx.amt; }
          });
        });
        if (f>0){ fsum+=f; fn++; }
      }
      var favg = fn>0 ? fsum/fn : 0;
      if (favg>=5 && fiber>=20 && fiber>favg*1.5){ pts+=25; why.push("Fiber jumped to "+Math.round(fiber)+"g vs your usual "+Math.round(favg)+"g — gut bacteria ferment the sudden extra fiber into gas."); }
      else if (fiber>=40){ pts+=12; why.push("Very high-fiber day ("+Math.round(fiber)+"g) — healthy, but gas-producing."); }
      if (sugars>=75){ pts+=14; why.push(Math.round(sugars)+"g sugar — excess sugar ferments in the gut and adds gas."); }
      else if (sugars>=50){ pts+=7; why.push(Math.round(sugars)+"g sugar — a mild gas risk."); }
      if (big>=900 || bigFat>=40){ pts+=14; why.push("Big"+(bigFat>=40?", fatty":"")+" meal ("+Math.round(big).toLocaleString()+" kcal) — fat slows stomach emptying, so the fullness lingers."); }
      else if (big>=650){ pts+=7; why.push("Hearty meal ("+Math.round(big).toLocaleString()+" kcal) — some fullness expected."); }
      var w = waterCalc(ds), wr = w.target>0 ? (d.waterOz||0)/(w.target*8) : 1;
      if (w.target>0 && wr<0.75){ pts+=10; why.push("Behind on water ("+Math.round(wr*100)+"% of target) — when you're dry the body holds onto water, adding to the puff."); }
      var alc = alcData(d).std;
      if (alc>0){ pts+=5; why.push("Alcohol irritates the gut lining — a small extra bloat nudge."); }
      var score = Math.max(0, Math.min(100, Math.round(pts)));
      return {score:score, why:why, label:score<=25?"Comfortable":score<=50?"Full":score<=75?"Bloated":"Very bloated"};
    }

    /* ============ panel render (v1 behavior, v2 design) ============ */
    function paintWheelV2(arcId, numId, frac, color, label){
      var arc = document.getElementById(arcId), C = 2*Math.PI*36;
      arc.style.strokeDasharray = C;
      arc.style.strokeDashoffset = frac===null ? C : C*(1-frac);
      arc.style.stroke = color;
      document.getElementById(numId).textContent = label;
    }
    function paintScoreWheelV2(){
      var a = adherenceStats(), t = tiredLevel(), b = bloatScore();
      var aFrac = a.pct===null ? null : Math.min(a.pct,100)/100;
      paintWheelV2("adhArc","adhNum", aFrac,
        a.pct===null ? "rgba(255,255,255,.4)" : a.pct>=80 ? "#2fe3b6" : a.pct>=50 ? "#ffffff" : "#ff8a9d",
        a.pct===null ? "–" : a.pct+"%");
      paintWheelV2("fatigueArc","fatigueNum", t.level/5,
        t.level<=2 ? "#2fe3b6" : t.level===3 ? "#ffffff" : t.level===4 ? "#ffd23d" : "#ff8a9d",
        String(t.level));
      var bFrac = b.score===null ? null : b.score/100;
      paintWheelV2("bloatArc","bloatNum", bFrac,
        b.score===null ? "rgba(255,255,255,.4)" : b.score<=25 ? "#2fe3b6" : b.score<=50 ? "#ffffff" : b.score<=75 ? "#ffd23d" : "#ff8a9d",
        b.score===null ? "–" : b.score+"%");
    }
    function ringPaintV2(eCal, mCal, tCal){
      var C1 = 2*Math.PI*56, C2 = 2*Math.PI*46;
      var mFrac = mCal>0 ? Math.min(eCal/mCal,1) : 0;
      var maint = document.getElementById("ringMaint");
      maint.style.strokeDasharray = C1;
      maint.style.strokeDashoffset = C1*(1-mFrac);
      var sGoal = tCal-mCal, track = document.getElementById("ringSurpTrack"), surp = document.getElementById("ringSurp");
      if (mCal>0 && sGoal>0){
        track.style.display = ""; surp.style.display = "";
        var sFrac = Math.min(Math.max(eCal-mCal,0)/sGoal, 1);
        surp.style.strokeDasharray = C2;
        surp.style.strokeDashoffset = C2*(1-sFrac);
        surp.style.stroke = eCal>=tCal ? "#2fbf71" : "#ffffff";
      } else { track.style.display = "none"; surp.style.display = "none"; }
    }
    var DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    function renderWeekStrip(){
      var wrap = document.getElementById('wkDays');
      wrap.innerHTML = "";
      var today = new Date(); today.setHours(12,0,0,0);
      var sun = new Date(today); sun.setDate(today.getDate()-today.getDay()+weekOff*7);
      var vd = viewDate(), ts = todayStr();
      for (var i=0;i<7;i++){
        (function(i){
          var d = new Date(sun); d.setDate(sun.getDate()+i);
          var ks = dstr(d);
          var b = document.createElement("button");
          b.className = "wk-day"+(ks===vd?" sel":"")+(ks===ts?" today":"");
          if (ks > ts) b.disabled = true;
          var dd = S.days[ks];
          var logged = dd && MEALS.some(function(m){ return ((dd.meals||{})[m]||[]).length; });
          var dotCls = ks===ts ? "now" : (logged ? "log" : "");
          b.innerHTML = '<span class="dow">'+DOWS[i]+'</span><span class="dnum">'+d.getDate()+'</span>'+
            '<span class="dot '+dotCls+'"'+(dotCls?"":' style="opacity:0"')+'></span>';
          b.addEventListener("click", function(){
            var dd2 = new Date(d); dd2.setHours(12,0,0,0);
            dayOffset = Math.round((dd2-today)/864e5);
            renderPanel();
          });
          wrap.appendChild(b);
        })(i);
      }
      document.getElementById('todayRow').style.display = vd===ts ? "none" : "flex";
      document.getElementById('wkNext').disabled = weekOff >= 0;
    }
    function renderPanel(){
      var k = viewDate(), t = totals(k), g = S.goals||{};
      var mCal = g.maintenance>0?g.maintenance:0;
      var tCal = mCal+(g.surplus>0?g.surplus:0);
      var eCal = t.cal;
      var dt = new Date(k+"T12:00:00");
      document.getElementById('intakeDate').textContent =
        dt.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
      document.getElementById('calEaten').textContent = Math.round(eCal).toLocaleString('en-US');
      var left = tCal-eCal;
      document.getElementById('flagKcal').textContent =
        left>=0 ? Math.round(left).toLocaleString('en-US')+" kcal" : Math.round(-left).toLocaleString('en-US')+" over";
      var fsur = document.getElementById('flagSur');
      if (eCal > mCal){ fsur.textContent = "+"+Math.round(eCal-mCal).toLocaleString('en-US')+" SUR"; fsur.classList.add("on"); }
      else { fsur.textContent = Math.round(mCal-eCal).toLocaleString('en-US')+" to SUR"; fsur.classList.remove("on"); }
      document.getElementById('progPct').textContent = (tCal>0 ? Math.round(eCal/tCal*100) : 0)+"%";
      ringPaintV2(eCal, mCal, tCal);
      var st = statusInfo(), fill = document.getElementById('spFill');
      fill.style.width = (st.tCal>0 ? Math.min(st.eCal/st.tCal,1)*100 : 0)+"%";
      fill.style.background = st.grad;
      document.getElementById('spMark').style.left = "calc("+(st.tCal>0 ? st.mCal/st.tCal*100 : 0)+"% - 1px)";
      paintScoreWheelV2();
      renderWeekStrip();
    }
    document.getElementById('wkPrev').addEventListener('click', function(){ weekOff--; renderPanel(); });
    document.getElementById('wkNext').addEventListener('click', function(){ if (weekOff<0){ weekOff++; renderPanel(); } });
    document.getElementById('todayPill').addEventListener('click', function(){ dayOffset = 0; weekOff = 0; renderPanel(); });

    /* ---------- bottom sheet: zone + score details ---------- */
    function openSheet(html){
      document.getElementById('sheetBody').innerHTML = html;
      document.getElementById('sheetBack').classList.add('open');
      document.getElementById('sheet').classList.add('open');
    }
    function closeSheet(){
      document.getElementById('sheetBack').classList.remove('open');
      document.getElementById('sheet').classList.remove('open');
    }
    document.getElementById('sheetBack').addEventListener('click', closeSheet);
    function zoneSheetHTML(){
      var g = S.goals||{}, m = g.maintenance>0?g.maintenance:0, tc = m+(g.surplus>0?g.surplus:0);
      var st = statusInfo();
      function zrow(color, name, range, html){
        return '<div class="zonerow"><span class="zdot" style="background:'+color+'"></span><div><b>'+name+
          ' <span class="zrange">'+range+'</span></b><p>'+html+'</p></div></div>';
      }
      return '<div class="zonenow"><b>'+esc(st.title)+'</b><p>'+esc(st.det)+'</p></div>' +
        zrow("#ff5c5c","Deficit","under "+Math.round(m).toLocaleString('en-US')+" cal",
          "Below maintenance. A sustained deficit around 500 cal/day can prevent lean mass gains, and undereating brings fatigue, worse sleep and stalled lifts.") +
        zrow("#ff9f43","Building",Math.round(m).toLocaleString('en-US')+" – "+Math.round(tc).toLocaleString('en-US')+" cal",
          "Past maintenance. You're in surplus territory — close the gap to hit your full gaining target.") +
        zrow("#2fbf71","On track",Math.round(tc).toLocaleString('en-US')+"+ cal",
          "Daily target hit: maintenance covered plus your full surplus, for growth.") +
        '<div class="zonefoot">Zones come from your goals: '+Math.round(m).toLocaleString('en-US')+' maintenance + '+
          Math.round(g.surplus>0?g.surplus:0).toLocaleString('en-US')+' surplus.</div>';
    }
    function scoreSheetHTML(){
      var a = adherenceStats(), t = tiredLevel(), b = bloatScore();
      var html = a.pct===null
        ? '<div class="irow"><b>Adherence:</b> no logged days in the last 2 weeks yet — log meals and this fills in.</div>'
        : '<div class="irow"><b>Adherence: '+a.pct+'%</b> — '+a.hit+' of '+a.n+' logged days (last 14) hit calories within ±10% of goal and protein ≥90%.</div>';
      html += '<div class="irow"><b>Fatigue: '+t.level+'/5 — '+t.label+'.</b> An estimate from what you consumed: last night\'s drinks (dose-weighted), drinks today, a carb-dominant or oversized recent meal, a sugary meal\'s crash, water well under target late in the day, and running far under your calorie goal. No sleep tracking, no body-clock — missing data never makes it worse.</div>';
      html += t.why.map(function(w){ return '<div class="irow">• '+esc(w)+'</div>'; }).join("");
      html += '<div class="irow"><b>Bloat: '+(b.score===null?"–":b.score+"/100 — "+b.label)+'.</b> Predicted from today\'s sodium, fiber, sugar, meal size, water, and alcohol.</div>';
      html += b.why.map(function(w){ return '<div class="irow">• '+esc(w)+'</div>'; }).join("");
      return html;
    }
    document.getElementById('zoneInfo').addEventListener('click', function(){ openSheet(zoneSheetHTML()); });
    ["fatigueWheel","bloatWheel","adhWheel"].forEach(function(id){
      document.getElementById(id).addEventListener('click', function(){ openSheet(scoreSheetHTML()); });
    });

    /* ---------- nutrition analysis view ---------- */
    function renderAnalysis(){
      var k = viewDate(), g = S.goals||{}, t = totals(k), mc = mealCals(k);
      var dt = new Date(k+"T12:00:00");
      document.getElementById('anaTitle').textContent =
        k===todayStr() ? "Today" : (dt.getMonth()+1)+"/"+dt.getDate()+"/"+String(dt.getFullYear()).slice(2);
      var mCal = g.maintenance>0?g.maintenance:0, tCal = mCal+(g.surplus>0?g.surplus:0);
      document.getElementById('aCal').textContent = Math.round(t.cal).toLocaleString('en-US');
      document.getElementById('aGoal').textContent = "of "+Math.round(tCal).toLocaleString('en-US')+" goal";
      var C = 2*Math.PI*54, acc = 0, segHtml = "";
      MEALS.forEach(function(m){
        var frac = tCal>0 ? mc[m]/tCal : 0;
        if (frac > 0.004){
          segHtml += '<circle cx="64" cy="64" r="54" fill="none" stroke="'+MEAL_SEG[m]+'" stroke-width="13"'+
            ' stroke-dasharray="'+(C*frac).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-C*acc).toFixed(2)+'" stroke-linecap="butt"/>';
        }
        acc += frac;
      });
      document.getElementById('aSeg').innerHTML = segHtml;
      var tot = t.cal;
      document.getElementById('aMealTable').innerHTML = FOOD_MEALS.map(function(m){
        var pct = tot>0 ? Math.round(mc[m]/tot*100) : 0;
        return '<tr><td><span class="mdot" style="background:'+MEAL_SEG[m]+'"></span>'+MEAL_LABEL[m]+'</td><td>'+
          Math.round(mc[m]).toLocaleString('en-US')+' kcal</td><td>'+pct+'%</td></tr>';
      }).join("");
      document.getElementById('aNote').innerHTML = tot>0
        ? '<b>'+Math.round(tCal-tot).toLocaleString('en-US')+' kcal</b> to your daily target of '+Math.round(tCal).toLocaleString('en-US')+'.<br>Protein '+r1(t.p)+'g of '+(g.protein||0)+'g.'
        : 'Nothing logged yet.';
      var fib = dayTotals(k).fiber, fibT = fiberTarget();
      var rows = [
        ["Carbs", r1(t.c)+"g", g.carbs||0, barW(t.c, g.carbs||0)],
        ["Protein", r1(t.p)+"g", g.protein||0, barW(t.p, g.protein||0)],
        ["Fat", r1(t.f)+"g", g.fat||0, barW(t.f, g.fat||0)],
        ["Fiber", r1(fib)+"g", fibT, barW(fib, fibT)]
      ];
      document.getElementById('aMacros').innerHTML = rows.map(function(r){
        return '<div class="amac"><div class="amac-top"><span>'+r[0]+'</span><span>'+r[1]+' <i>of '+r[2]+'g</i></span></div>'+
          '<div class="amac-bar"><i style="width:'+r[3]+'"></i></div></div>';
      }).join("");
    }
    document.getElementById('analysisLink').addEventListener('click', function(){ renderAnalysis(); show('view-analysis'); });
    document.getElementById('analysisBack').addEventListener('click', function(){ show('view-home'); });

    /* ---------- home content ---------- */
    document.getElementById('hdrDate').textContent =
      now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
    renderPanel();

    var h = document.querySelector('.fuel-header');
    var sc = document.getElementById('scroller');
    function onScroll(){ h.classList.toggle('scrolled', sc.scrollTop > 2); }
    sc.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  })();
</script>
</body>
